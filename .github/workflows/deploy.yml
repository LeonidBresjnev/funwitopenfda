name: Deploy to Google App Engine

on:
  push:
    branches:
      - main
      - master
      - with-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Add "id-token" with the intended permissions.
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - run: echo "Workflow started2"

      - run: echo "${{ github.repository }}"
      - run: echo "${{ github.repository_owner }}"

      - uses: 'actions/checkout@v4'

      - uses: 'google-github-actions/auth@v3'
        with:
          project_id: 'visualopenfda'
          workload_identity_provider: "projects/306621206188/locations/global/workloadIdentityPools/github/providers/my-repo"



      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Fat JAR
        run: ./gradlew :server:shadowJar

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to App Engine
        uses: google-github-actions/deploy-appengine@v2
        with:
          project_id: visualopenfda
          working_directory: server
          app_yaml: src/main/appengine/app.yaml
